[workspace]
members = ["minmux", "client", "daemon", "ipc"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["full"] }

# workspace crates
minmux-ipc = { path = "ipc" }
minmux-daemon = { path = "daemon" }
minmux-client = { path = "client" }
